<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 84" width="120" height="84">
  <!-- A cassette seen face on: a solid shell with the label, the two hubs and
       the tape opening cut out of it. Cut-outs rather than strokes, because the
       tile recolours the glyph by its alpha and a stroke would stay black. -->
  <mask id="cut">
    <rect x="0" y="0" width="120" height="84" fill="#fff"/>
    <rect x="20" y="20" width="80" height="13" rx="4" ry="4" fill="#000"/>
    <circle cx="41" cy="52" r="9" fill="#000"/>
    <circle cx="79" cy="52" r="9" fill="#000"/>
    <path d="M 46 68 L 74 68 L 70 76 L 50 76 Z" fill="#000"/>
  </mask>
  <rect x="6" y="10" width="108" height="64" rx="11" ry="11" mask="url(#cut)"/>
</svg>
