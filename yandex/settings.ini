; The Yandex Music addon's settings, as they sit on the card:
;
;     <card>/Addons/yandex/settings.ini
;
; This file ships filled in. The four keys are the official client's own and
; the MarshalX/yandex-music-api library publishes them, since it talks to the
; same API; the addon only carries what is already public. So nothing has to be
; typed in: "Sign in with a code" on the addon's screen works as it is.
;
; Where the four values are read from, when they have to be looked at again --
; https://github.com/MarshalX/yandex-music-api :
;
;   client_id, client_secret   yandex_music/_client/device_auth.py
;                              (_DEFAULT_CLIENT_ID, _DEFAULT_CLIENT_SECRET)
;   sign_key, client_header    yandex_music/utils/sign_request.py
;                              (DESKTOP_SIGN_KEY, DESKTOP_CLIENT)
;
; Two rules, both of them the service's, not this addon's:
;
;   - sign_key and client_header are a pair from the same client. The signature
;     of get-file-info is checked together with that header, so a key from the
;     Android app beside the desktop header is refused;
;   - client_header is the whole header line, name and value ("X-Yandex-Music-
;     Client: YandexMusicDesktopAppWindows/5.95.0"), because it is put into the
;     request as it stands. It carries the client's version and it ages: when
;     playback starts being refused, bump the version in it before suspecting
;     the key. A newer release zip carries a newer header, but it carries this
;     whole file too -- if you edited it, do not overwrite it when updating.
;
; One "key = value" per line; comments and blank lines are ignored. The addon
; reads the file at start and on "Read again from the card".

client_id = 23cabbbdc6cd418abb4b39c32c41195d
client_secret = 53bc75238f0c4d08a118e51fe9203300
sign_key = kzqU4XhfCaY6B6JTHODeq5
client_header = X-Yandex-Music-Client: YandexMusicDesktopAppWindows/5.95.0

; lossless (the default), high or normal -- a ceiling, not a promise: what the
; account may have decides the rest (yandex.c, QUALITIES).
quality = lossless

; Where the API and the OAuth endpoint are, when they are not the real ones
; (a mock, or a mirror). Left out, the defaults stand.
; base_url = https://api.music.yandex.net
; auth_url = https://oauth.yandex.ru
