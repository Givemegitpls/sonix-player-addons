<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128" width="96" height="128">
  <!-- Calculator body: solid shell with the display and keys cut out of it.
       Cut-outs rather than strokes, because make_icon.py recolours the glyph
       by its alpha and a stroke would stay black. -->
  <mask id="cut">
    <rect x="0" y="0" width="96" height="128" fill="#fff"/>
    <!-- display -->
    <rect x="14" y="14" width="68" height="26" rx="5" ry="5" fill="#000"/>
    <!-- 3x4 key grid -->
    <rect x="14" y="50" width="18" height="14" rx="3" ry="3" fill="#000"/>
    <rect x="39" y="50" width="18" height="14" rx="3" ry="3" fill="#000"/>
    <rect x="64" y="50" width="18" height="14" rx="3" ry="3" fill="#000"/>
    <rect x="14" y="70" width="18" height="14" rx="3" ry="3" fill="#000"/>
    <rect x="39" y="70" width="18" height="14" rx="3" ry="3" fill="#000"/>
    <rect x="64" y="70" width="18" height="14" rx="3" ry="3" fill="#000"/>
    <rect x="14" y="90" width="18" height="14" rx="3" ry="3" fill="#000"/>
    <rect x="39" y="90" width="18" height="14" rx="3" ry="3" fill="#000"/>
    <rect x="64" y="90" width="18" height="14" rx="3" ry="3" fill="#000"/>
  </mask>
  <rect x="6" y="4" width="84" height="120" rx="14" ry="14" mask="url(#cut)"/>
</svg>
