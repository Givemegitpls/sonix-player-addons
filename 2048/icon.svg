<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 128" width="96" height="128">
  <!-- Mini 2x2 board: solid shell with four tile cut-outs. make_icon.py
       recolours by alpha, so cut-outs rather than strokes. -->
  <mask id="cut">
    <rect x="0" y="0" width="96" height="128" fill="#fff"/>
    <rect x="18" y="30" width="26" height="26" rx="5" ry="5" fill="#000"/>
    <rect x="52" y="30" width="26" height="26" rx="5" ry="5" fill="#000"/>
    <rect x="18" y="64" width="26" height="26" rx="5" ry="5" fill="#000"/>
    <rect x="52" y="64" width="26" height="26" rx="5" ry="5" fill="#000"/>
  </mask>
  <rect x="10" y="22" width="76" height="76" rx="12" ry="12" mask="url(#cut)"/>
</svg>
