name: addons

# Builds what changed, checks the ABI, and uploads the folder that goes on a
# card. Everything with an addon.json is built when it changes -- compiling an
# addon is how its code is kept honest -- but only the addons named in
# RELEASE_ADDONS below are packed or published. That is the gate the old
# whitelist was: docs/ADDONS.md, "What is built, and what is released" --
# piped, zvuk, tidal and spotify compile but have never been verified on a
# device, and a release is not the place to find out.
#
# Only what changed is built. The first job turns the commit range (or the tag)
# into a list of addon ids; `common/`, the player submodule and the Makefile are
# compiled into every addon or decide how, so they mean every addon. See
# tools/changed_addons.py.
#
# Releases are per addon. A tag named `<id>-v<version>` (dino-v0.2.0) builds
# that one addon and publishes `dino.zip` beside its metadata fragment
# `dino.json`; a tag naming an addon outside RELEASE_ADDONS fails and releases
# nothing. The old all-in-one tags (`0.0.7`) still build and publish every
# releasable addon, so nothing that already exists stops working.
#
# The catalogue the store fetches and the bundle old clients read are the same
# release, tagged `latest`: `index.json` (tools/publish_index.py) and a byte copy
# of every current archive (tools/rolling_release.py). The addon requests the
# file directly from that release -- no API call, no rate limit, no zip
# downloads -- and store builds that read "the newest release" get the archives
# out of the same place:
#
#     https://github.com/<owner>/<name>/releases/download/latest/index.json
#
# The tag is put on a fresh commit of the `releases` branch, because the release
# list is ordered by the tagged commit's date and a tie is broken by tag name: a
# bundle sharing a commit with an addon release loses to `yandex-v0.2.0`, and the
# separate `store` release lost to `latest` for the same reason
# (docs/ADDONS.md, "The copy for old clients").
#
# check-exports is not here on purpose: it compares the addons' undefined
# symbols with the player binary's dynamic symbol table, so it needs a built
# player (a full build, plus its static FreeType and audio libraries). A machine
# that has one runs `make checks`; the CI would be building the whole player to
# check the addons.

on:
  push:
    branches: [main]
    # `latest` is pushed by the job that publishes the catalogue, so it must not
    # start a run of its own (it would build nothing: a tag that names no addon).
    tags: ['*', '!latest']
  pull_request:
  workflow_dispatch:
    inputs:
      addons:
        description: 'Addon ids to build, space separated (empty = everything that changed)'
        required: false
        default: ''
      index:
        description: 'Rebuild and publish the store catalogue'
        type: boolean
        default: false

# gh release create/upload writes to the repository's releases; the build itself
# needs no permission at all.
permissions:
  contents: write

env:
  IMAGE: tempotec-player-build:ci
  # The only addons that are packed or published. Everything else still builds.
  RELEASE_ADDONS: 2048 addonstore cassette daily dino flappybird gearboy gravity qobuz quiz subsonic tictactoe yandex

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.pick.outputs.ids }}
      pack: ${{ steps.pick.outputs.pack }}
      any: ${{ steps.pick.outputs.any }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Four answers, in order: a tag names one addon (or, in the old shape,
      # everything); a dispatch names what it was given; otherwise the diff
      # decides. `ids` is what is built; `pack` is that intersected with
      # RELEASE_ADDONS, which is what is packed and can be published.
      - name: Which addons
        id: pick
        env:
          RELEASE: ${{ env.RELEASE_ADDONS }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          DISPATCH: ${{ inputs.addons }}
        run: |
          set -eu
          case "$REF" in
            refs/tags/*)
              tag="${REF#refs/tags/}"
              case "$tag" in
                *-v[0-9]*)
                  id="${tag%-v*}"
                  if [ ! -d "$id" ]; then
                    echo "::error::tag $tag names $id, which is not an addon folder here" >&2
                    printf 'ids=\npack=\nany=false\ntag=\n' >> "$GITHUB_OUTPUT"
                    exit 1
                  fi
                  case " $RELEASE " in
                    *" $id "*)
                      printf 'ids=%s\npack=%s\nany=true\ntag=%s\n' "$id" "$id" "$tag" >> "$GITHUB_OUTPUT"
                      exit 0
                      ;;
                  esac
                  echo "::error::tag $tag names $id, which is not in RELEASE_ADDONS: nothing is built or released" >&2
                  printf 'ids=\npack=\nany=false\ntag=\n' >> "$GITHUB_OUTPUT"
                  exit 1
                  ;;
              esac
              # The old shape: a version tag, one release with every releasable
              # addon in it. Any other tag (the compatibility `latest`, the
              # `releases` branch the catalogue lives on, the `store` tag old
              # builds left behind) releases nothing.
              if [[ "$tag" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
                printf 'ids=%s\npack=%s\nany=true\ntag=%s\n' "$RELEASE" "$RELEASE" "$tag" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              printf 'ids=\npack=\nany=false\ntag=\n' >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$DISPATCH" ]; then
            pack=""
            for id in $DISPATCH; do
              case " $RELEASE " in
                *" $id "*) pack="$pack $id" ;;
              esac
            done
            printf 'ids=%s\npack=%s\nany=true\ntag=\n' "$DISPATCH" "$pack" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            python3 tools/changed_addons.py --all --release "$RELEASE" --github-output "$GITHUB_OUTPUT"
            printf 'tag=\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$BEFORE"
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          fi
          python3 tools/changed_addons.py --base "$base" --head "$GITHUB_SHA" --release "$RELEASE" \
            --github-output "$GITHUB_OUTPUT"
          printf 'tag=\n' >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # buildx with its container driver: the default docker driver cannot
      # export the gha cache below, and the image is the slowest step here.
      - uses: docker/setup-buildx-action@v3

      - name: The image the addons are built in, from the player's Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: sonix-player/sonix-player/docker
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=player-image
          cache-to: type=gha,scope=player-image,mode=max

      # The cross toolchain is the expensive half of a build (20-60 minutes in
      # the player's own runs). It is a directory in the submodule, so it can be
      # cached: keyed by what decides its contents, the Dockerfile's package list
      # and rockboxdev's own sources and patches.
      - name: Cache the cross toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: sonix-player/sonix-player/rockbox-toolchain
          key: rockbox-toolchain-${{ hashFiles('sonix-player/sonix-player/docker/Dockerfile', 'sonix-player/sonix-player/rockboxdev/**') }}

      # The goal is the toolchain's own gcc by its absolute path: the rule in the
      # player's Makefile is `$(CROSS_CC)`, which is
      # `$(ROCKBOX_TOOLCHAIN_DIR)/bin/mipsel-rockbox-linux-gnu-gcc` and so an
      # absolute path, and make matches command-line goals by string, not by
      # resolving them (`No rule to make target 'rockbox-toolchain/bin/...'`).
      # The tree is mounted at its own absolute path, so the path is the same
      # inside the container as here.
      - name: Build the cross toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          player="$PWD/sonix-player/sonix-player"
          docker run --rm \
            -v "$PWD:$PWD" -w "$player" \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            "$IMAGE" \
            make "$player/rockbox-toolchain/bin/mipsel-rockbox-linux-gnu-gcc"

      # The addons include LVGL's headers as the player's interface does. The
      # player's Makefile clones the pinned tag; this repository does the same,
      # through the `lvgl` goal.
      - name: LVGL
        run: make lvgl

      - name: Build what changed
        env:
          IDS: ${{ needs.changes.outputs.ids }}
        run: make target ADDON_IDS="$IDS"

      - name: ABI check (nothing newer than glibc 2.16)
        run: make check-abi

      # Packing is the release gate: an addon outside RELEASE_ADDONS compiles
      # above and is then left out of the card folder and of every release.
      - name: Pack what may be released
        if: needs.changes.outputs.pack != ''
        env:
          PACK: ${{ needs.changes.outputs.pack }}
        run: make pack ADDON_IDS="$PACK"

      - name: Upload the card folder
        if: needs.changes.outputs.pack != ''
        uses: actions/upload-artifact@v4
        with:
          name: addons
          path: build/Addons
          if-no-files-found: error

      # One zip per addon, and the files sit at the root of it: `make pack` has
      # already produced exactly what belongs in <card>/Addons/<id>/, so the
      # archive is that folder's contents and nothing else. Unzip it into
      # <card>/Addons/<id>/ -- the addon.json, the .so, the icon, and assets/
      # where an addon has one. Next to it goes <id>.json, the fragment the
      # store's catalogue is built from.
      #
      # A per-addon tag also pins the version: what is in addon.json must be the
      # number in the tag, so the catalogue, the release and the card agree.
      - name: Zip and metadata
        if: needs.changes.outputs.tag != ''
        env:
          PACK: ${{ needs.changes.outputs.pack }}
          TAG: ${{ needs.changes.outputs.tag }}
        run: |
          set -eu
          case "$TAG" in
            *-v*) version="${TAG##*-v}" ;;
            *) version="" ;;
          esac
          if [ -n "$version" ]; then
            python3 tools/release_zip.py --build build/Addons --out build/release --ids "$PACK" \
              --expect-version "$version"
          else
            python3 tools/release_zip.py --build build/Addons --out build/release --ids "$PACK"
          fi

      - name: Upload the release files
        if: needs.changes.outputs.tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: build/release
          if-no-files-found: error

      # The tag is what the release is called, and re-running the same tag
      # replaces the files rather than failing on "already exists".
      - name: Publish the release
        if: needs.changes.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.changes.outputs.tag }}
        run: |
          set -eu
          test -n "$(ls build/release/*.zip 2>/dev/null)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/release/*.zip build/release/*.json --clobber
          else
            gh release create "$TAG" build/release/*.zip build/release/*.json \
              --title "$TAG" --generate-notes
          fi

  # The store's catalogue and the copy old clients read, in one release. The
  # catalogue (`index.json`) is built out of the release list -- the newest
  # version of each addon -- and `latest` then carries it beside byte copies of
  # every current archive: those files keep their size and sha256, so a client
  # that is already current is offered nothing, and nothing is rebuilt, only
  # transferred. The release is recreated on a fresh commit of the `releases`
  # branch, which is what puts it above every addon release in the list;
  # ROLLING_RELEASE=off in the repository variables stops the job.
  latest:
    needs: [changes, build]
    if: |
      always() &&
      (needs.changes.outputs.tag != '' || inputs.index) &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      vars.ROLLING_RELEASE != 'off'
    runs-on: ubuntu-latest
    concurrency: addon-index
    steps:
      - uses: actions/checkout@v4

      - name: Build the catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_index.py --repo "$GITHUB_REPOSITORY" --out build/index.json

      # The tag goes on a new commit of `releases` and the files are the ones the
      # catalogue names, verified by size and sha256 before they are uploaded.
      - name: Publish the catalogue and the archives it names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/rolling_release.py --repo "$GITHUB_REPOSITORY" \
            --index build/index.json --publish
