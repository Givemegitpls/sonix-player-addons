name: addons

# Builds the whitelist, checks the ABI, and uploads the folder that goes on a
# card. Why a whitelist and not everything with an addon.json: docs/ADDONS.md,
# "What is built, and what is not" -- zvuk, tidal and spotify compile but have
# never been verified on a device, and an artifact is not the place to find out.
#
# check-exports is not here on purpose: it compares the addons' undefined
# symbols with the player binary's dynamic symbol table, so it needs a built
# player (a full build, plus its static FreeType and audio libraries). A machine
# that has one runs `make checks`; the CI would be building the whole player to
# check the addons.

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

# gh release create/upload writes to the repository's releases; the build itself
# needs no permission at all.
permissions:
  contents: write

env:
  IMAGE: tempotec-player-build:ci
  ADDON_IDS: cassette dino flappybird gearboy hello qobuz subsonic yandex

jobs:
  addons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # buildx with its container driver: the default docker driver cannot
      # export the gha cache below, and the image is the slowest step here.
      - uses: docker/setup-buildx-action@v3

      - name: The image the addons are built in, from the player's Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: sonix-player/sonix-player/docker
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=player-image
          cache-to: type=gha,scope=player-image,mode=max

      # The cross toolchain is the expensive half of a build (20-60 minutes in
      # the player's own runs). It is a directory in the submodule, so it can be
      # cached: keyed by what decides its contents, the Dockerfile's package list
      # and rockboxdev's own sources and patches.
      - name: Cache the cross toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: sonix-player/sonix-player/rockbox-toolchain
          key: rockbox-toolchain-${{ hashFiles('sonix-player/sonix-player/docker/Dockerfile', 'sonix-player/sonix-player/rockboxdev/**') }}

      # The goal is the toolchain's own gcc by its absolute path: the rule in the
      # player's Makefile is `$(CROSS_CC)`, which is
      # `$(ROCKBOX_TOOLCHAIN_DIR)/bin/mipsel-rockbox-linux-gnu-gcc` and so an
      # absolute path, and make matches command-line goals by string, not by
      # resolving them (`No rule to make target 'rockbox-toolchain/bin/...'`).
      # The tree is mounted at its own absolute path, so the path is the same
      # inside the container as here.
      - name: Build the cross toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          player="$PWD/sonix-player/sonix-player"
          docker run --rm \
            -v "$PWD:$PWD" -w "$player" \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            "$IMAGE" \
            make "$player/rockbox-toolchain/bin/mipsel-rockbox-linux-gnu-gcc"

      # The addons include LVGL's headers as the player's interface does. The
      # player's Makefile clones the pinned tag; this repository does the same,
      # through the `lvgl` goal.
      - name: LVGL
        run: make lvgl

      - name: Build the whitelist
        run: make target

      - name: ABI check (nothing newer than glibc 2.16)
        run: make check-abi

      - name: Pack
        run: make pack

      - name: Upload the card folder
        uses: actions/upload-artifact@v4
        with:
          name: addons
          path: build/Addons
          if-no-files-found: error

      # One zip per addon, and the files sit at the root of it: `make pack` has
      # already produced exactly what belongs in <card>/Addons/<id>/, so the
      # archive is that folder's contents and nothing else. Unzip it into
      # <card>/Addons/<id>/ -- the addon.json, the .so, the icon, and assets/
      # where an addon has one.
      - name: Zip each addon
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p release
          for dir in build/Addons/*/; do
            id="$(basename "$dir")"
            # python3 -m zipfile rather than zip(1): the module puts the names
            # at the root of the archive as they are, and python3 is a
            # dependency of this repository's tools already.
            ( cd "$dir" && python3 -m zipfile -c "$GITHUB_WORKSPACE/release/$id.zip" . )
            [ -s "release/$id.zip" ] || { echo "release: $id.zip is empty" >&2; exit 1; }
            echo "release/$id.zip:"
            python3 -m zipfile -l "release/$id.zip"
          done

      # The tag is what the release is called, and re-running the same tag
      # replaces the files rather than failing on "already exists".
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/*.zip --clobber
          else
            gh release create "$tag" release/*.zip \
              --title "$tag" --generate-notes
          fi
